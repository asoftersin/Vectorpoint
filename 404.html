<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Vectorpoint</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f6f4ef">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f4ef;
      --text: #15171a;
      --muted: #3c4047;
      --accent: #0a66d1;
      --line: #e1dcd1;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .eyebrow {
      font-family: "Geist Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 20px;
    }
    h1 {
      font-size: clamp(34px, 6vw, 64px);
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.08;
      margin-bottom: 20px;
    }
    p { color: var(--muted); margin-bottom: 36px; font-size: 17px; }
    .btn {
      display: inline-block;
      background: var(--text);
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      font-size: 16px;
      padding: 14px 26px;
      border-radius: 6px;
      transition: opacity 0.2s ease;
    }
    .btn:hover { opacity: 0.85; }
    .contact { margin: 28px 0 0; font-size: 15px; }
    .contact a { color: var(--text); text-underline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">404 · SIDAN SAKNAS</p>
    <h1>Det här flödet finns inte.</h1>
    <p>Sidan du letar efter har flyttats eller aldrig funnits. Men det gör inget, allt viktigt finns på startsidan.</p>
    <a class="btn" href="/">Till startsidan</a>
    <p class="contact">Eller skriv direkt till <a href="mailto:johan@vectorpoint.se">johan@vectorpoint.se</a></p>
  </main>
</body>
</html>
